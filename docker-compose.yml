# Працює в зовнішній Docker-мережі infra (там живуть postgres і Caddy з /opt/n8n).
# Порти на хост не публікуються: Caddy проксує tarilka.romis.cloud -> tarilka-app:8000.
services:
  app:
    build: .
    image: tarilka:local
    env_file: .env
    volumes:
      - media:/data/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      infra:
        aliases: [tarilka-app]

  worker:
    image: tarilka:local
    # yt-dlp ламається після змін на платформах — оновлюємо при кожному старті
    # (cron на хості щодня перезапускає worker, див. README).
    command:
      - sh
      - -c
      - >-
        uv pip install --python /opt/venv/bin/python -q -U yt-dlp
        || echo "yt-dlp: оновити не вдалося, працюємо з наявною версією";
        exec python -m app.worker
    env_file: .env
    volumes:
      - media:/data/media
      - ./secrets:/secrets:ro
    depends_on:
      app:
        condition: service_healthy  # міграції виконує app
    restart: unless-stopped
    networks: [infra]

volumes:
  media:

networks:
  infra:
    external: true
